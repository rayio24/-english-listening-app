<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English Listening Trainer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      background: #f5f5f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 20px;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .label {
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;

      border:
        1px solid #ccc;

      border-radius: 10px;

      font-size: 16px;

      margin-bottom: 10px;
    }

    button {
      border: none;

      border-radius: 10px;

      padding: 11px 15px;

      margin: 4px;

      font-size: 15px;

      background: #222;

      color: white;

      cursor: pointer;
    }

    button.secondary {
      background: #e5e5ea;
      color: #222;
    }

    button.active {
      background: #007aff;
    }

    button.danger {
      background: #ff3b30;
    }

    .video {
      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 12px;

      overflow: hidden;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .time {
      font-size: 18px;

      text-align: center;

      margin: 15px 0 5px;

      font-variant-numeric:
        tabular-nums;
    }

    .range {
      width: 100%;
    }

    .row {
      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 4px;
    }

    .status {
      text-align: center;

      color: #666;

      font-size: 14px;

      min-height: 20px;

      margin-top: 8px;
    }

    .ab {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }

    .ab button {
      width: 100%;
      margin: 0;
    }

    .ab-value {
      text-align: center;

      font-size: 14px;

      color: #555;

      margin-top: 5px;
    }

    .section {
      border: 1px solid #ddd;

      border-radius: 12px;

      padding: 12px;

      margin-bottom: 10px;

      background: #fafafa;
    }

    .section-title {
      font-weight: bold;

      font-size: 16px;

      margin-bottom: 4px;
    }

    .section-time {
      color: #666;

      font-size: 14px;

      margin-bottom: 8px;
    }

    .section-buttons {
      display: flex;

      flex-wrap: wrap;

      gap: 4px;
    }

    .section-buttons button {
      margin: 0;
    }

    .empty {
      color: #888;

      text-align: center;

      padding: 15px 0;

      font-size: 14px;
    }

    .small {
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎧 English Listening Trainer</h1>


  <!-- ========================= -->
  <!-- URL -->
  <!-- ========================= -->

  <div class="card">

    <div class="label">
      YouTube URL
    </div>

    <input
      id="urlInput"
      type="text"
      placeholder="https://www.youtube.com/watch?v=..."
    >

    <button onclick="loadVideo()">
      動画を読み込む
    </button>

    <div
      class="status"
      id="status">
    </div>

  </div>


  <!-- ========================= -->
  <!-- VIDEO -->
  <!-- ========================= -->

  <div class="card">

    <div class="video">

      <div id="player"></div>

    </div>


    <div
      class="time"
      id="timeDisplay">

      00:00 / 00:00

    </div>


    <input
      id="seekBar"
      class="range"
      type="range"
      min="0"
      max="100"
      value="0"
      step="0.1"
      oninput="seekVideo(this.value)"
    >


    <div class="row">

      <button onclick="playVideo()">
        ▶ 再生
      </button>

      <button onclick="pauseVideo()">
        ⏸ 一時停止
      </button>

      <button onclick="rewind()">
        ↩ 5秒戻る
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- SPEED -->
  <!-- ========================= -->

  <div class="card">

    <div class="label">
      再生速度
    </div>


    <div class="row">

      <button
        class="secondary"
        onclick="setSpeed(0.5)">
        0.5x
      </button>

      <button
        class="secondary"
        onclick="setSpeed(0.75)">
        0.75x
      </button>

      <button
        class="secondary"
        onclick="setSpeed(1)">
        1x
      </button>

      <button
        class="secondary"
        onclick="setSpeed(1.25)">
        1.25x
      </button>

      <button
        class="secondary"
        onclick="setSpeed(1.5)">
        1.5x
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- A-B -->
  <!-- ========================= -->

  <div class="card">

    <h2>
      A-Bリピート
    </h2>


    <div class="ab">

      <div>

        <button onclick="setA()">
          A地点を設定
        </button>

        <div
          class="ab-value"
          id="aValue">

          A: --:--

        </div>

      </div>


      <div>

        <button onclick="setB()">
          B地点を設定
        </button>

        <div
          class="ab-value"
          id="bValue">

          B: --:--

        </div>

      </div>

    </div>


    <div class="row"
         style="margin-top:12px;">

      <button
        id="repeatButton"
        onclick="toggleRepeat()">

        A-Bリピート OFF

      </button>


      <button
        class="secondary"
        onclick="clearAB()">

        リセット

      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- SECTION -->
  <!-- ========================= -->

  <div class="card">

    <h2>
      📚 セクション
    </h2>


    <div class="small">

      A地点とB地点を設定してから
      「セクション追加」を押してください。

    </div>


    <div class="row"
         style="margin-top:10px;">

      <button onclick="addSection()">

        ＋ セクション追加

      </button>

    </div>


    <div
      id="sections">

    </div>

  </div>

</div>


<!-- YouTube API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>


// =====================================================
// VARIABLES
// =====================================================

let player = null;

let aPoint = null;

let bPoint = null;

let repeatEnabled = false;

let duration = 0;

let currentVideoId = null;

let sections = [];


// =====================================================
// YOUTUBE API READY
// =====================================================

function onYouTubeIframeAPIReady() {

  player = new YT.Player(
    "player",
    {

      width: "100%",

      height: "100%",

      videoId: "",

      playerVars: {

        playsinline: 1,

        rel: 0

      },

      events: {

        onReady: onPlayerReady

      }

    }
  );

}


// =====================================================
// PLAYER READY
// =====================================================

function onPlayerReady() {

  document.getElementById("status").textContent =
    "動画URLを入力してください";

  startTimer();

}


// =====================================================
// LOAD VIDEO
// =====================================================

function loadVideo() {

  const url =
    document
      .getElementById("urlInput")
      .value
      .trim();


  const videoId =
    extractVideoId(url);


  if (!videoId) {

    document.getElementById("status").textContent =
      "YouTube URLを確認してください";

    return;

  }


  currentVideoId = videoId;


  player.loadVideoById(videoId);


  // A/B reset

  aPoint = null;

  bPoint = null;

  repeatEnabled = false;


  updateABDisplay();


  document.getElementById(
    "repeatButton"
  ).textContent =
    "A-Bリピート OFF";


  // この動画のセクションを読み込む

  loadSections();


  document.getElementById("status").textContent =
    "動画を読み込みました";

}


// =====================================================
// EXTRACT VIDEO ID
// =====================================================

function extractVideoId(url) {

  try {

    const parsed =
      new URL(url);


    if (
      parsed.hostname.includes(
        "youtu.be"
      )
    ) {

      return parsed
        .pathname
        .substring(1);

    }


    if (
      parsed.hostname.includes(
        "youtube.com"
      )
    ) {

      return parsed
        .searchParams
        .get("v");

    }

  }
  catch (e) {

    return null;

  }


  return null;

}


// =====================================================
// PLAY
// =====================================================

function playVideo() {

  if (player) {

    player.playVideo();

  }

}


// =====================================================
// PAUSE
// =====================================================

function pauseVideo() {

  if (player) {

    player.pauseVideo();

  }

}


// =====================================================
// REWIND
// =====================================================

function rewind() {

  if (!player) return;


  const current =
    player.getCurrentTime();


  player.seekTo(
    Math.max(
      0,
      current - 5
    ),
    true
  );

}


// =====================================================
// SPEED
// =====================================================

function setSpeed(speed) {

  if (!player) return;


  player.setPlaybackRate(
    speed
  );

}


// =====================================================
// SEEK
// =====================================================

function seekVideo(value) {

  if (
    !player ||
    !duration
  ) return;


  const time =
    (value / 100) *
    duration;


  player.seekTo(
    time,
    true
  );

}


// =====================================================
// SET A
// =====================================================

function setA() {

  if (!player) return;


  aPoint =
    player.getCurrentTime();


  if (
    bPoint !== null &&
    aPoint >= bPoint
  ) {

    bPoint = null;

  }


  updateABDisplay();

}


// =====================================================
// SET B
// =====================================================

function setB() {

  if (!player) return;


  bPoint =
    player.getCurrentTime();


  if (
    aPoint !== null &&
    bPoint <= aPoint
  ) {

    aPoint = null;

  }


  updateABDisplay();

}


// =====================================================
// TOGGLE REPEAT
// =====================================================

function toggleRepeat() {

  if (
    aPoint === null ||
    bPoint === null
  ) {

    alert(
      "まずA地点とB地点を設定してください"
    );

    return;

  }


  repeatEnabled =
    !repeatEnabled;


  document.getElementById(
    "repeatButton"
  ).textContent =
    repeatEnabled
      ? "A-Bリピート ON"
      : "A-Bリピート OFF";

}


// =====================================================
// CLEAR A/B
// =====================================================

function clearAB() {

  aPoint = null;

  bPoint = null;

  repeatEnabled = false;


  document.getElementById(
    "repeatButton"
  ).textContent =
    "A-Bリピート OFF";


  updateABDisplay();

}


// =====================================================
// UPDATE A/B DISPLAY
// =====================================================

function updateABDisplay() {

  document.getElementById(
    "aValue"
  ).textContent =
    "A: " +
    (
      aPoint === null
        ? "--:--"
        : formatTime(aPoint)
    );


  document.getElementById(
    "bValue"
  ).textContent =
    "B: " +
    (
      bPoint === null
        ? "--:--"
        : formatTime(bPoint)
    );

}


// =====================================================
// ADD SECTION
// =====================================================

function addSection() {

  if (
    aPoint === null ||
    bPoint === null
  ) {

    alert(
      "先にA地点とB地点を設定してください"
    );

    return;

  }


  if (
    !currentVideoId
  ) {

    alert(
      "先に動画を読み込んでください"
    );

    return;

  }


  const section = {

    id:
      Date.now(),

    start:
      aPoint,

    end:
      bPoint,

    repeat:
      false

  };


  sections.push(section);


  saveSections();


  renderSections();

}


// =====================================================
// RENDER SECTIONS
// =====================================================

function renderSections() {

  const container =
    document.getElementById(
      "sections"
    );


  container.innerHTML = "";


  if (
    sections.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">' +
      'まだセクションがありません' +
      '</div>';

    return;

  }


  sections.forEach(
    (section, index) => {


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "section";


      div.innerHTML = `

        <div class="section-title">
          Section ${index + 1}
        </div>

        <div class="section-time">
          ${formatTime(section.start)}
          →
          ${formatTime(section.end)}
        </div>

        <div class="section-buttons">

          <button
            onclick="playSection(${section.id})">

            ▶ 再生

          </button>


          <button
            class="${
              section.repeat
                ? "active"
                : "secondary"
            }"
            onclick="toggleSectionRepeat(${section.id})">

            ${
              section.repeat
                ? "🔁 リピートON"
                : "🔁 リピートOFF"
            }

          </button>


          <button
            class="danger"
            onclick="deleteSection(${section.id})">

            削除

          </button>

        </div>
      `;


      container.appendChild(div);

    }
  );

}


// =====================================================
// PLAY SECTION
// =====================================================

function playSection(id) {

  const section =
    sections.find(
      s => s.id === id
    );


  if (!section) return;


  if (!player) return;


  player.seekTo(
    section.start,
    true
  );


  player.playVideo();


  // A/Bリピートを一旦解除

  repeatEnabled = false;


  document.getElementById(
    "repeatButton"
  ).textContent =
    "A-Bリピート OFF";

}


// =====================================================
// SECTION REPEAT
// =====================================================

function toggleSectionRepeat(id) {

  const section =
    sections.find(
      s => s.id === id
    );


  if (!section) return;


  section.repeat =
    !section.repeat;


  saveSections();


  renderSections();

}


// =====================================================
// DELETE SECTION
// =====================================================

function deleteSection(id) {

  sections =
    sections.filter(
      s => s.id !== id
    );


  saveSections();


  renderSections();

}


// =====================================================
// SAVE SECTIONS
// =====================================================

function saveSections() {

  if (!currentVideoId) return;


  localStorage.setItem(

    "englishTrainer_" +
    currentVideoId,

    JSON.stringify(
      sections
    )

  );

}


// =====================================================
// LOAD SECTIONS
// =====================================================

function loadSections() {

  if (!currentVideoId) return;


  const saved =
    localStorage.getItem(

      "englishTrainer_" +
      currentVideoId

    );


  if (saved) {

    try {

      sections =
        JSON.parse(saved);

    }
    catch (e) {

      sections = [];

    }

  }
  else {

    sections = [];

  }


  renderSections();

}


// =====================================================
// FORMAT TIME
// =====================================================

function formatTime(seconds) {

  seconds =
    Math.floor(seconds);


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  return (
    String(minutes)
      .padStart(2, "0")
    +
    ":"
    +
    String(secs)
      .padStart(2, "0")
  );

}


// =====================================================
// TIMER
// =====================================================

function startTimer() {

  setInterval(
    () => {

      if (
        !player ||
        typeof player.getCurrentTime !==
          "function"
      ) {

        return;

      }


      try {

        const current =
          player.getCurrentTime();


        duration =
          player.getDuration();


        if (!duration) return;


        document.getElementById(
          "timeDisplay"
        ).textContent =

          formatTime(current)
          +
          " / "
          +
          formatTime(duration);


        document.getElementById(
          "seekBar"
        ).value =

          (
            current /
            duration
          ) * 100;


        // ---------------------------------
        // A-B repeat
        // ---------------------------------

        if (
          repeatEnabled &&
          aPoint !== null &&
          bPoint !== null &&
          current >= bPoint
        ) {

          player.seekTo(
            aPoint,
            true
          );

        }


        // ---------------------------------
        // Section repeat
        // ---------------------------------

        const repeatingSection =
          sections.find(
            section =>
              section.repeat === true &&
              current >= section.end &&
              current < section.end + 2
          );


        if (
          repeatingSection
        ) {

          player.seekTo(
            repeatingSection.start,
            true
          );

        }

      }
      catch (e) {

        // プレイヤー準備中は無視

      }

    },

    200

  );

}


</script>

</body>
</html>
