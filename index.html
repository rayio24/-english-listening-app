<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Listening Trainer</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
  position: relative;
}

h1 { font-size: 24px; }
h2 { font-size: 21px; }
h3 { margin-bottom: 10px; }

button, input, textarea {
  font-size: 16px;
}

button {
  padding: 9px 13px;
  margin: 3px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: white;
}

button:active { opacity: .7; }

button.secondary { background: #666; }
button.danger { background: #a33; }
button.light { background: #888; }

input[type="text"],
textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-bottom: 10px;
}

textarea {
  min-height: 140px;
  resize: vertical;
}

#libraryButton {
  position: absolute;
  top: 0;
  right: 0;
}

#player {
  margin-top: 15px;
}

.controls { margin-top: 10px; }

#seekBar { width: 100%; }

.time {
  font-size: 14px;
  color: #666;
}

.video-title {
  color: #666;
  font-size: 14px;
  margin: -8px 0 12px;
  padding-right: 150px;
}

.panel,
.section,
.script-item,
.library-item {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-top: 12px;
}

.script-item {
  border: 2px solid transparent;
}

.script-item.selected {
  border-color: #222;
}

.script-number {
  font-size: 13px;
  color: #777;
  margin-bottom: 5px;
}

.script-text {
  line-height: 1.5;
}

.section-title {
  font-weight: bold;
  margin-bottom: 8px;
}

.small {
  font-size: 13px;
  color: #666;
}

.dictation {
  margin-top: 12px;
  padding: 12px;
  background: #f0f0f0;
  border-radius: 10px;
}

.answer {
  display: none;
  margin-top: 10px;
  padding: 10px;
  background: white;
  border-radius: 8px;
}

.result {
  display: none;
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
}

.correct { background: #dff5df; }
.incorrect { background: #ffe0e0; }

.library-item {
  background: #f5f5f5;
}

.library-title {
  font-weight: bold;
  font-size: 17px;
}

.library-url {
  font-size: 12px;
  color: #777;
  word-break: break-all;
  margin: 5px 0;
}

.badge {
  display: inline-block;
  font-size: 12px;
  padding: 3px 7px;
  border-radius: 6px;
  background: #ddd;
  margin-top: 5px;
}

.hidden { display: none !important; }

hr {
  border: 0;
  border-top: 1px solid #ddd;
  margin: 25px 0;
}

.empty {
  color: #777;
  padding: 15px 0;
}

.time-setting {
  margin-top: 10px;
  padding: 10px;
  background: #f5f5f5;
  border-radius: 8px;
}

.time-setting strong {
  display: block;
  margin-bottom: 5px;
}
</style>
</head>

<body>

<div class="container" id="app">

<button id="libraryButton" onclick="showLibrary()">
📚 動画ライブラリ
</button>

<h1>🎧 English Listening Trainer</h1>

<div id="currentVideoTitle" class="video-title">
動画未選択
</div>

<input
  type="text"
  id="youtubeUrl"
  placeholder="YouTube URLを入力"
/>

<button onclick="loadVideo()">
動画を読み込む
</button>

<div id="player"></div>

<div class="controls">

<div class="time">
<span id="currentTime">0:00</span>
/
<span id="duration">0:00</span>
</div>

<input
  type="range"
  id="seekBar"
  min="0"
  max="100"
  value="0"
  step="0.1"
  oninput="seekVideo(this.value)"
>

<div>
<button onclick="playVideo()">▶ 再生</button>
<button onclick="pauseVideo()">⏸ 一時停止</button>
<button onclick="rewind()">↩ 5秒戻る</button>
</div>

<div>
<button onclick="setSpeed(.5)">0.5x</button>
<button onclick="setSpeed(.75)">0.75x</button>
<button onclick="setSpeed(1)">1x</button>
<button onclick="setSpeed(1.25)">1.25x</button>
<button onclick="setSpeed(1.5)">1.5x</button>
</div>

</div>

<hr>

<div class="panel">

<h3>📖 全文スクリプト</h3>

<div class="small">
全文を貼り付けて保存すると、文章単位に分割できます。
</div>

<textarea
id="scriptText"
placeholder="ここにBBCなどの全文スクリプトを貼り付けてください"
></textarea>

<button onclick="saveScript()">
スクリプトを保存
</button>

<button class="secondary" onclick="clearScript()">
クリア
</button>

</div>

<div id="scriptSection"></div>

<hr>

<h3>A/Bリピート</h3>

<button onclick="setA()">A地点</button>
<button onclick="setB()">B地点</button>
<button onclick="toggleRepeat()">ON/OFF</button>
<button onclick="clearAB()">クリア</button>

<p id="abDisplay">A: - / B: - / OFF</p>

<button onclick="addSectionFromAB()">
＋現在のA/Bをセクション化
</button>

<h3>セクション</h3>

<div id="sections"></div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player = null;

let currentVideoId = null;
let currentVideoTitle = "";

let aPoint = null;
let bPoint = null;
let repeatEnabled = false;
let duration = 0;

let sections = [];
let scriptSentences = [];


// =====================================================
// YouTube
// =====================================================

function onYouTubeIframeAPIReady() {

  player = new YT.Player("player", {
    height: "220",
    width: "100%",
    videoId: "",
    playerVars: {
      playsinline: 1
    },
    events: {
      onReady: () => console.log("YouTube ready")
    }
  });

}


function extractVideoId(url) {

  try {

    const u = new URL(url);

    if (u.hostname.includes("youtu.be")) {
      return u.pathname.slice(1);
    }

    if (u.hostname.includes("youtube.com")) {
      return u.searchParams.get("v");
    }

  } catch(e) {}

  return null;
}


// =====================================================
// Video loading
// =====================================================

async function loadVideo() {

  const url =
    document.getElementById("youtubeUrl").value.trim();

  const id = extractVideoId(url);

  if (!id) {
    alert("YouTube URLを確認してください");
    return;
  }

  currentVideoId = id;

  const existing = getVideos()[id];

  if (existing) {

    currentVideoTitle =
      existing.title || "YouTube動画";

    sections =
      existing.sections || [];

    scriptSentences =
      existing.scriptSentences || [];

    document.getElementById("scriptText").value =
      existing.script || "";

  } else {

    currentVideoTitle =
      await getYouTubeTitle(id);

    sections = [];
    scriptSentences = [];

    document.getElementById("scriptText").value = "";

    saveCurrentVideo();
  }

  player.loadVideoById(id);

  aPoint = null;
  bPoint = null;
  repeatEnabled = false;

  updateVideoTitle();
  renderScript();
  renderSections();
  updateABDisplay();

}


async function getYouTubeTitle(id) {

  try {

    const response =
      await fetch(
        `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`
      );

    if (!response.ok) {
      return "YouTube動画";
    }

    const data = await response.json();

    return data.title || "YouTube動画";

  } catch(e) {

    return "YouTube動画";

  }

}


function updateVideoTitle() {

  const el =
    document.getElementById("currentVideoTitle");

  if (el) {
    el.textContent = currentVideoTitle;
  }

}


// =====================================================
// Storage
// =====================================================

function getVideos() {

  try {

    return JSON.parse(
      localStorage.getItem("englishTrainerVideos") || "{}"
    );

  } catch(e) {

    return {};

  }

}


function saveVideos(videos) {

  localStorage.setItem(
    "englishTrainerVideos",
    JSON.stringify(videos)
  );

}


function saveCurrentVideo() {

  if (!currentVideoId) return;

  const videos = getVideos();

  videos[currentVideoId] = {

    id: currentVideoId,

    title: currentVideoTitle,

    url:
      `https://www.youtube.com/watch?v=${currentVideoId}`,

    script:
      document.getElementById("scriptText")?.value || "",

    scriptSentences,

    sections

  };

  saveVideos(videos);

}


// =====================================================
// Script
// =====================================================

function saveScript() {

  if (!currentVideoId) {

    alert("先に動画を読み込んでください");

    return;

  }

  const text =
    document.getElementById("scriptText").value.trim();

  if (!text) {

    alert("スクリプトを入力してください");

    return;

  }

  scriptSentences =
    splitScript(text);

  saveCurrentVideo();

  renderScript();

  alert(
    `${scriptSentences.length}個の文章に分割しました。`
  );

}


function splitScript(text) {

  /*
   * 英文の . ! ? を基本的な文章区切りとして使用。
   * 改行だけで区切られているBBCスクリプトにも対応。
   */

  let normalized =
    text
      .replace(/\r/g, "")
      .replace(/[ \t]+/g, " ");

  const result = [];

  const blocks =
    normalized
      .split(/\n+/)
      .map(x => x.trim())
      .filter(Boolean);

  blocks.forEach(block => {

    const matches =
      block.match(
        /[^.!?]+(?:[.!?]+|$)/g
      );

    if (matches) {

      matches.forEach(sentence => {

        const s =
          sentence.trim();

        if (s) {
          result.push(s);
        }

      });

    } else {

      result.push(block);

    }

  });

  return result;

}


function clearScript() {

  if (!currentVideoId) return;

  if (!confirm("スクリプトを削除しますか？")) {
    return;
  }

  document.getElementById("scriptText").value = "";

  scriptSentences = [];

  saveCurrentVideo();

  renderScript();

}


function renderScript() {

  const container =
    document.getElementById("scriptSection");

  if (!container) return;

  if (!currentVideoId) {

    container.innerHTML = "";

    return;

  }

  if (!scriptSentences.length) {

    container.innerHTML = "";

    return;

  }

  let html = `

    <div class="panel">

      <h3>📝 スクリプトからセクションを作成</h3>

      <div class="small">
        セクションに含めたい文章を選択してください。
        複数選択もできます。
      </div>

  `;

  scriptSentences.forEach((sentence, index) => {

    const used =
      sections.some(
        s =>
          s.sentenceIds &&
          s.sentenceIds.includes(index)
      );

    html += `

      <div
        class="script-item ${used ? "" : ""}"
      >

        <label>

          <input
            type="checkbox"
            class="script-check"
            value="${index}"
          >

          <span class="script-number">
            ${index + 1}
          </span>

          <span class="script-text">
            ${escapeHtml(sentence)}
          </span>

        </label>

        ${
          used
            ? `<div class="badge">セクション登録済み</div>`
            : ""
        }

      </div>

    `;

  });

  html += `

    <button onclick="createSectionFromScript()">
      ＋選択した文章からセクションを作成
    </button>

    </div>

  `;

  container.innerHTML = html;

}


// =====================================================
// Section creation from script
// =====================================================

function createSectionFromScript() {

  const checked =
    [...document.querySelectorAll(".script-check:checked")]
      .map(el => Number(el.value));

  if (!checked.length) {

    alert("文章を1つ以上選択してください");

    return;

  }

  checked.sort((a,b) => a-b);

  const answer =
    checked
      .map(i => scriptSentences[i])
      .join(" ");

  const section = {

    id: Date.now(),

    start: null,

    end: null,

    repeat: false,

    answer,

    sentenceIds: checked

  };

  sections.push(section);

  saveCurrentVideo();

  renderScript();
  renderSections();

  alert(
    "セクションを作成しました。\n動画上でA/Bの時間を設定してください。"
  );

}


// =====================================================
// A/B
// =====================================================

function setA() {

  if (!player) return;

  aPoint =
    player.getCurrentTime();

  updateABDisplay();

}


function setB() {

  if (!player) return;

  bPoint =
    player.getCurrentTime();

  updateABDisplay();

}


function toggleRepeat() {

  if (
    aPoint === null ||
    bPoint === null
  ) {

    alert("先にA地点とB地点を設定してください");

    return;

  }

  if (bPoint <= aPoint) {

    alert("B地点はA地点より後にしてください");

    return;

  }

  repeatEnabled =
    !repeatEnabled;

  updateABDisplay();

}


function clearAB() {

  aPoint = null;
  bPoint = null;
  repeatEnabled = false;

  updateABDisplay();

}


function updateABDisplay() {

  const a =
    aPoint === null
      ? "-"
      : formatTime(aPoint);

  const b =
    bPoint === null
      ? "-"
      : formatTime(bPoint);

  const el =
    document.getElementById("abDisplay");

  if (el) {

    el.textContent =
      `A: ${a} / B: ${b} / ${repeatEnabled ? "ON" : "OFF"}`;

  }

}


// =====================================================
// A/B → section
// =====================================================

function addSectionFromAB() {

  if (!currentVideoId) {

    alert("先に動画を読み込んでください");

    return;

  }

  if (
    aPoint === null ||
    bPoint === null
  ) {

    alert("A地点とB地点を設定してください");

    return;

  }

  if (bPoint <= aPoint) {

    alert("B地点はA地点より後にしてください");

    return;

  }

  const section = {

    id: Date.now(),

    start: aPoint,

    end: bPoint,

    repeat: false,

    answer: "",

    sentenceIds: []

  };

  sections.push(section);

  saveCurrentVideo();

  renderSections();

}


// =====================================================
// Section rendering
// =====================================================

function renderSections() {

  const container =
    document.getElementById("sections");

  if (!container) return;

  container.innerHTML = "";

  if (!sections.length) {

    container.innerHTML =
      `<div class="empty">
        まだセクションがありません。
      </div>`;

    return;

  }

  sections.forEach((section, index) => {

    const div =
      document.createElement("div");

    div.className = "section";

    const sentenceText =
      section.sentenceIds &&
      section.sentenceIds.length
        ? section.sentenceIds
            .map(i => scriptSentences[i])
            .join(" ")
        : section.answer || "";

    div.innerHTML = `

      <div class="section-title">
        Section ${index + 1}
      </div>

      <div class="small">
        ${
          section.start === null
            ? "開始時間未設定"
            : formatTime(section.start)
        }
        →
        ${
          section.end === null
            ? "終了時間未設定"
            : formatTime(section.end)
        }
      </div>

      ${
        sentenceText
          ? `
            <div class="script-box">
              ${escapeHtml(sentenceText)}
            </div>
          `
          : ""
      }

      <div>

        <button onclick="playSection(${section.id})">
          ▶ 再生
        </button>

        <button onclick="setSectionTime(${section.id})">
          ⏱ 現在位置を設定
        </button>

        <button onclick="toggleSectionRepeat(${section.id})">
          ${
            section.repeat
              ? "🔁 リピートON"
              : "🔁 リピートOFF"
          }
        </button>

        <button onclick="openDictation(${section.id})">
          📝 ディクテーション
        </button>

        <button
          class="danger"
          onclick="deleteSection(${section.id})"
        >
          🗑 削除
        </button>

      </div>

      <div class="time-setting">

        <strong>
          動画時間
        </strong>

        <div>
          A:
          ${
            section.start === null
              ? "-"
              : formatTime(section.start)
          }
        </div>

        <div>
          B:
          ${
            section.end === null
              ? "-"
              : formatTime(section.end)
          }
        </div>

        <div class="small">
          「⏱ 現在位置を設定」は、
          A → B の順で押してください。
        </div>

      </div>

      <div
        id="dictation-${section.id}"
        class="dictation hidden"
      >

        <div class="small">
          まず動画を何度も聞いて、
          聞こえた英文を入力してください。
        </div>

        <textarea
          id="input-${section.id}"
          placeholder="ここに聞き取った英文を入力"
        ></textarea>

        <button
          onclick="submitDictation(${section.id})"
        >
          回答を確定
        </button>

        <div
          id="submitted-${section.id}"
          class="result"
        ></div>

        <button
          id="showAnswerButton-${section.id}"
          class="secondary hidden"
          onclick="showAnswer(${section.id})"
        >
          正解を表示
        </button>

        <div
          id="answer-${section.id}"
          class="answer"
        >
          <strong>正解：</strong>
          <div>
            ${escapeHtml(section.answer || "正解文がありません")}
          </div>
        </div>

      </div>

    `;

    container.appendChild(div);

  });

}


// =====================================================
// Section time setting
// =====================================================

function setSectionTime(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section || !player) return;

  const now =
    player.getCurrentTime();

  if (section.start === null) {

    section.start = now;

    alert(
      `開始時間を ${formatTime(now)} に設定しました。\n\n動画を終了地点まで進めて、もう一度このボタンを押してください。`
    );

  } else if (section.end === null) {

    if (now <= section.start) {

      alert("終了時間は開始時間より後にしてください");

      return;

    }

    section.end = now;

    alert(
      `終了時間を ${formatTime(now)} に設定しました。`
    );

  } else {

    const choice =
      confirm(
        `現在位置 ${formatTime(now)} を開始時間に設定しますか？\n\n「キャンセル」で終了時間を設定します。`
      );

    if (choice) {

      section.start = now;

    } else {

      if (now <= section.start) {

        alert("終了時間は開始時間より後にしてください");

        return;

      }

      section.end = now;

    }

  }

  saveCurrentVideo();

  renderSections();

}


// =====================================================
// Section playback
// =====================================================

function playSection(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section) return;

  if (section.start === null) {

    alert("開始時間が設定されていません");

    return;

  }

  repeatEnabled = false;

  player.seekTo(
    section.start,
    true
  );

  player.playVideo();

  updateABDisplay();

}


function toggleSectionRepeat(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section) return;

  if (
    section.start === null ||
    section.end === null
  ) {

    alert("先にセクションの開始・終了時間を設定してください");

    return;

  }

  section.repeat =
    !section.repeat;

  saveCurrentVideo();

  renderSections();

}


function deleteSection(id) {

  if (!confirm("このセクションを削除しますか？")) {
    return;
  }

  sections =
    sections.filter(s => s.id !== id);

  saveCurrentVideo();

  renderScript();
  renderSections();

}


// =====================================================
// Dictation
// =====================================================

function openDictation(id) {

  const box =
    document.getElementById(`dictation-${id}`);

  if (!box) return;

  box.classList.toggle("hidden");

}


function submitDictation(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section) return;

  if (!section.answer) {

    alert(
      "このセクションには正解文が設定されていません。"
    );

    return;

  }

  const input =
    document.getElementById(`input-${id}`).value.trim();

  if (!input) {

    alert("回答を入力してください");

    return;

  }

  const submitted =
    document.getElementById(`submitted-${id}`);

  submitted.style.display = "block";

  submitted.className =
    "result";

  submitted.innerHTML =
    "回答を確定しました。まず自分の回答を見直してから、正解を表示してください。";

  const button =
    document.getElementById(
      `showAnswerButton-${id}`
    );

  button.classList.remove("hidden");

}


function showAnswer(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section) return;

  const input =
    document.getElementById(`input-${id}`).value;

  const answer =
    section.answer;

  const answerBox =
    document.getElementById(`answer-${id}`);

  answerBox.style.display =
    "block";

  const inputNormalized =
    normalizeText(input);

  const answerNormalized =
    normalizeText(answer);

  const submitted =
    document.getElementById(`submitted-${id}`);

  if (
    inputNormalized ===
    answerNormalized
  ) {

    submitted.className =
      "result correct";

    submitted.innerHTML =
      "🎉 正解！";

  } else {

    submitted.className =
      "result incorrect";

    submitted.innerHTML =
      "惜しいです。正解と見比べてみましょう。";

  }

}


function normalizeText(text) {

  return String(text)
    .toLowerCase()
    .replace(
      /[.,!?;:"'“”‘’()[\]{}]/g,
      ""
    )
    .replace(/\s+/g, " ")
    .trim();

}


// =====================================================
// Video library
// =====================================================

function showLibrary() {

  const videos =
    getVideos();

  const ids =
    Object.keys(videos).reverse();

  let html = `

    <div class="panel">

      <h2>📚 動画ライブラリ</h2>

      <button
        class="secondary"
        onclick="returnToMain()"
      >
        ← 戻る
      </button>

  `;

  if (!ids.length) {

    html += `
      <div class="empty">
        まだ動画がありません。<br>
        YouTube動画を読み込むと自動的に登録されます。
      </div>
    `;

  } else {

    ids.forEach(id => {

      const video =
        videos[id];

      const sentenceCount =
        video.scriptSentences?.length || 0;

      const sectionCount =
        video.sections?.length || 0;

      html += `

        <div class="library-item">

          <div class="library-title">
            ${escapeHtml(
              video.title || "YouTube動画"
            )}
          </div>

          <div class="library-url">
            ${escapeHtml(video.url)}
          </div>

          <div class="small">
            文章 ${sentenceCount}件 /
            セクション ${sectionCount}件
          </div>

          <button
            onclick="openSavedVideo('${id}')"
          >
            ▶ 開く
          </button>

          <button
            class="danger"
            onclick="deleteSavedVideo('${id}')"
          >
            🗑 削除
          </button>

        </div>

      `;

    });

  }

  html += `</div>`;

  document.getElementById("app").innerHTML =
    html;

}


function returnToMain() {

  location.reload();

}


function openSavedVideo(id) {

  const video =
    getVideos()[id];

  if (!video) return;

  currentVideoId =
    video.id;

  currentVideoTitle =
    video.title || "YouTube動画";

  sections =
    video.sections || [];

  scriptSentences =
    video.scriptSentences || [];

  renderMain();

  document.getElementById("youtubeUrl").value =
    video.url;

  document.getElementById("scriptText").value =
    video.script || "";

  updateVideoTitle();

  player.loadVideoById(currentVideoId);

  renderScript();
  renderSections();

}


function deleteSavedVideo(id) {

  const videos =
    getVideos();

  const title =
    videos[id]?.title || "この動画";

  if (!confirm(
    `「${title}」を削除しますか？\n\nスクリプトとセクションも削除されます。`
  )) {
    return;
  }

  delete videos[id];

  saveVideos(videos);

  showLibrary();

}


// =====================================================
// Main UI restore
// =====================================================

function renderMain() {

  document.getElementById("app").innerHTML = `

    <button
      id="libraryButton"
      onclick="showLibrary()"
    >
      📚 動画ライブラリ
    </button>

    <h1>🎧 English Listening Trainer</h1>

    <div
      id="currentVideoTitle"
      class="video-title"
    >
      動画未選択
    </div>

    <input
      type="text"
      id="youtubeUrl"
      placeholder="YouTube URLを入力"
    >

    <button onclick="loadVideo()">
      動画を読み込む
    </button>

    <div id="player"></div>

    <div class="controls">

      <div class="time">
        <span id="currentTime">0:00</span>
        /
        <span id="duration">0:00</span>
      </div>

      <input
        type="range"
        id="seekBar"
        min="0"
        max="100"
        value="0"
        step="0.1"
        oninput="seekVideo(this.value)"
      >

      <div>
        <button onclick="playVideo()">▶ 再生</button>
        <button onclick="pauseVideo()">⏸ 一時停止</button>
        <button onclick="rewind()">↩ 5秒戻る</button>
      </div>

      <div>
        <button onclick="setSpeed(.5)">0.5x</button>
        <button onclick="setSpeed(.75)">0.75x</button>
        <button onclick="setSpeed(1)">1x</button>
        <button onclick="setSpeed(1.25)">1.25x</button>
        <button onclick="setSpeed(1.5)">1.5x</button>
      </div>

    </div>

    <hr>

    <div class="panel">

      <h3>📖 全文スクリプト</h3>

      <div class="small">
        全文を貼り付けて保存すると、文章単位に分割できます。
      </div>

      <textarea
        id="scriptText"
        placeholder="ここにBBCなどの全文スクリプトを貼り付けてください"
      ></textarea>

      <button onclick="saveScript()">
        スクリプトを保存
      </button>

      <button
        class="secondary"
        onclick="clearScript()"
      >

      </button>

    </div>

    <div id="scriptSection"></div>

    <hr>

    <h3>A/Bリピート</h3>

    <button onclick="setA()">A地点</button>
    <button onclick="setB()">B地点</button>
    <button onclick="toggleRepeat()">ON/OFF</button>
    <button onclick="clearAB()">クリア</button>

    <p id="abDisplay">
      A: - / B: - / OFF
    </p>

    <button onclick="addSectionFromAB()">
      ＋現在のA/Bをセクション化
    </button>

    <h3>セクション</h3>

    <div id="sections"></div>

  `;

}


// =====================================================
// YouTube controls
// =====================================================

function playVideo() {
  if (player) player.playVideo();
}


function pauseVideo() {
  if (player) player.pauseVideo();
}


function rewind() {

  if (!player) return;

  player.seekTo(
    Math.max(
      0,
      player.getCurrentTime() - 5
    ),
    true
  );

}


function seekVideo(value) {

  if (!player || !duration) return;

  player.seekTo(
    Number(value),
    true
  );

}


function setSpeed(speed) {

  if (!player) return;

  player.setPlaybackRate(speed);

}


// =====================================================
// Timer
// =====================================================

setInterval(() => {

  if (
    !player ||
    !player.getCurrentTime
  ) {
    return;
  }

  try {

    const current =
      player.getCurrentTime();

    duration =
      player.getDuration() || 0;

    const currentEl =
      document.getElementById("currentTime");

    const durationEl =
      document.getElementById("duration");

    const seekEl =
      document.getElementById("seekBar");

    if (currentEl) {
      currentEl.textContent =
        formatTime(current);
    }

    if (durationEl) {
      durationEl.textContent =
        formatTime(duration);
    }

    if (seekEl) {

      seekEl.max =
        duration;

      seekEl.value =
        current;

    }

    if (
      repeatEnabled &&
      aPoint !== null &&
      bPoint !== null &&
      current >= bPoint
    ) {

      player.seekTo(
        aPoint,
        true
      );

    }

    sections.forEach(section => {

      if (
        section.repeat &&
        section.start !== null &&
        section.end !== null &&
        current >= section.end &&
        current < section.end + 2
      ) {

        player.seekTo(
          section.start,
          true
        );

      }

    });

  } catch(e) {}

}, 200);


// =====================================================
// Utilities
// =====================================================

function formatTime(seconds) {

  if (!seconds || isNaN(seconds)) {
    return "0:00";
  }

  const min =
    Math.floor(seconds / 60);

  const sec =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2, "0");

  return `${min}:${sec}`;

}


function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
