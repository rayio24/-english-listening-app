<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Listening Trainer</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  font-size: 24px;
}

input, textarea, button {
  font-size: 16px;
}

input[type="text"],
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-bottom: 10px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  padding: 9px 13px;
  margin: 3px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: white;
}

button:active {
  opacity: 0.7;
}

#player {
  margin-top: 15px;
}

.controls {
  margin-top: 10px;
}

#seekBar {
  width: 100%;
}

.time {
  font-size: 14px;
  color: #666;
}

.section {
  background: white;
  padding: 15px;
  margin-top: 12px;
  border-radius: 12px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 8px;
}

.dictation {
  margin-top: 12px;
  padding: 12px;
  background: #f0f0f0;
  border-radius: 10px;
}

.answer {
  margin-top: 10px;
  padding: 10px;
  background: white;
  border-radius: 8px;
  display: none;
}

.result {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  display: none;
}

.correct {
  background: #dff5df;
}

.incorrect {
  background: #ffe0e0;
}

.small {
  font-size: 13px;
  color: #666;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🎧 English Listening Trainer</h1>

<input
  type="text"
  id="youtubeUrl"
  placeholder="YouTube URLを入力"
/>

<button onclick="loadVideo()">動画を読み込む</button>

<div id="player"></div>

<div class="controls">

  <div class="time">
    <span id="currentTime">0:00</span>
    /
    <span id="duration">0:00</span>
  </div>

  <input
    type="range"
    id="seekBar"
    min="0"
    max="100"
    value="0"
    step="0.1"
    oninput="seekVideo(this.value)"
  >

  <div>
    <button onclick="playVideo()">▶ 再生</button>
    <button onclick="pauseVideo()">⏸ 一時停止</button>
    <button onclick="rewind()">↩ 5秒戻る</button>
  </div>

  <div>
    <button onclick="setSpeed(0.5)">0.5x</button>
    <button onclick="setSpeed(0.75)">0.75x</button>
    <button onclick="setSpeed(1)">1x</button>
    <button onclick="setSpeed(1.25)">1.25x</button>
    <button onclick="setSpeed(1.5)">1.5x</button>
  </div>

</div>

<hr>

<h3>A/Bリピート</h3>

<button onclick="setA()">A地点</button>
<button onclick="setB()">B地点</button>
<button onclick="toggleRepeat()">ON/OFF</button>
<button onclick="clearAB()">クリア</button>

<p id="abDisplay">A: - / B: - / OFF</p>

<button onclick="addSection()">＋セクション追加</button>

<h3>セクション</h3>

<div id="sections"></div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;
let aPoint = null;
let bPoint = null;
let repeatEnabled = false;
let duration = 0;

let currentVideoId = null;
let sections = [];


// ============================
// YouTube
// ============================

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    height: "220",
    width: "100%",
    videoId: "",
    playerVars: {
      playsinline: 1
    },
    events: {
      onReady: () => {
        console.log("YouTube ready");
      }
    }
  });
}


function extractVideoId(url) {

  try {

    const parsed = new URL(url);

    if (parsed.hostname.includes("youtu.be")) {
      return parsed.pathname.substring(1);
    }

    if (parsed.hostname.includes("youtube.com")) {
      return parsed.searchParams.get("v");
    }

  } catch(e) {}

  return null;
}


function loadVideo() {

  const url = document.getElementById("youtubeUrl").value;

  const id = extractVideoId(url);

  if (!id) {
    alert("YouTube URLを確認してください");
    return;
  }

  currentVideoId = id;

  player.loadVideoById(id);

  aPoint = null;
  bPoint = null;
  repeatEnabled = false;

  loadSections();

  updateABDisplay();
}


function playVideo() {
  if (player) player.playVideo();
}


function pauseVideo() {
  if (player) player.pauseVideo();
}


function rewind() {

  if (!player) return;

  const current = player.getCurrentTime();

  player.seekTo(Math.max(0, current - 5), true);
}


function seekVideo(value) {

  if (!player || !duration) return;

  const time = Number(value);

  player.seekTo(time, true);
}


function setSpeed(speed) {

  if (!player) return;

  player.setPlaybackRate(speed);
}


// ============================
// A/B
// ============================

function setA() {

  if (!player) return;

  aPoint = player.getCurrentTime();

  updateABDisplay();
}


function setB() {

  if (!player) return;

  bPoint = player.getCurrentTime();

  updateABDisplay();
}


function toggleRepeat() {

  if (aPoint === null || bPoint === null) {
    alert("先にA地点とB地点を設定してください");
    return;
  }

  if (bPoint <= aPoint) {
    alert("B地点はA地点より後にしてください");
    return;
  }

  repeatEnabled = !repeatEnabled;

  updateABDisplay();
}


function clearAB() {

  aPoint = null;
  bPoint = null;
  repeatEnabled = false;

  updateABDisplay();
}


function updateABDisplay() {

  const a =
    aPoint === null
      ? "-"
      : formatTime(aPoint);

  const b =
    bPoint === null
      ? "-"
      : formatTime(bPoint);

  document.getElementById("abDisplay").textContent =
    `A: ${a} / B: ${b} / ${repeatEnabled ? "ON" : "OFF"}`;
}


// ============================
// Sections
// ============================

function addSection() {

  if (!currentVideoId) {
    alert("先に動画を読み込んでください");
    return;
  }

  if (aPoint === null || bPoint === null) {
    alert("先にA地点とB地点を設定してください");
    return;
  }

  if (bPoint <= aPoint) {
    alert("B地点はA地点より後にしてください");
    return;
  }

  const section = {
    id: Date.now(),
    start: aPoint,
    end: bPoint,
    repeat: false,
    answer: ""
  };

  sections.push(section);

  saveSections();
  renderSections();
}


function renderSections() {

  const container = document.getElementById("sections");

  container.innerHTML = "";

  sections.forEach((section, index) => {

    const div = document.createElement("div");

    div.className = "section";

    div.innerHTML = `

      <div class="section-title">
        Section ${index + 1}
      </div>

      <div>
        ${formatTime(section.start)}
        →
        ${formatTime(section.end)}
      </div>

      <div>

        <button onclick="playSection(${section.id})">
          ▶ 再生
        </button>

        <button onclick="toggleSectionRepeat(${section.id})">
          ${section.repeat ? "🔁 リピートON" : "🔁 リピートOFF"}
        </button>

        <button onclick="openDictation(${section.id})">
          📝 ディクテーション
        </button>

        <button onclick="deleteSection(${section.id})">
          🗑 削除
        </button>

      </div>

      <div
        id="dictation-${section.id}"
        class="dictation hidden"
      >

        <div class="small">
          聞こえた英文を入力してください。
        </div>

        <textarea
          id="input-${section.id}"
          placeholder="ここに聞き取った英文を入力"
        ></textarea>

        <button onclick="checkAnswer(${section.id})">
          採点
        </button>

        <button onclick="toggleAnswer(${section.id})">
          答えを見る
        </button>

        <button onclick="saveAnswer(${section.id})">
          正解を保存
        </button>

        <div
          id="answer-${section.id}"
          class="answer"
        >
          <strong>正解：</strong>
          <div id="answerText-${section.id}">
            ${escapeHtml(section.answer || "まだ正解が登録されていません")}
          </div>
        </div>

        <div
          id="result-${section.id}"
          class="result"
        ></div>

      </div>
    `;

    container.appendChild(div);

  });
}


// ============================
// Section playback
// ============================

function playSection(id) {

  const section = sections.find(s => s.id === id);

  if (!section) return;

  repeatEnabled = false;

  player.seekTo(section.start, true);
  player.playVideo();

  updateABDisplay();
}


function toggleSectionRepeat(id) {

  const section = sections.find(s => s.id === id);

  if (!section) return;

  section.repeat = !section.repeat;

  saveSections();
  renderSections();
}


function deleteSection(id) {

  sections =
    sections.filter(s => s.id !== id);

  saveSections();
  renderSections();
}


// ============================
// Dictation
// ============================

function openDictation(id) {

  const box =
    document.getElementById(`dictation-${id}`);

  if (!box) return;

  box.classList.toggle("hidden");
}


function saveAnswer(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section) return;

  const answer =
    prompt(
      "このセクションの正解英文を入力してください",
      section.answer || ""
    );

  if (answer === null) return;

  section.answer = answer;

  saveSections();
  renderSections();

  const box =
    document.getElementById(`dictation-${id}`);

  if (box) {
    box.classList.remove("hidden");
  }
}


function toggleAnswer(id) {

  const answer =
    document.getElementById(`answer-${id}`);

  if (!answer) return;

  if (answer.style.display === "block") {
    answer.style.display = "none";
  } else {
    answer.style.display = "block";
  }
}


function normalizeText(text) {

  return text
    .toLowerCase()
    .replace(/[.,!?;:"'“”‘’()[\]{}]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}


function checkAnswer(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section) return;

  if (!section.answer) {

    alert("先に「正解を保存」してください");

    return;
  }

  const input =
    document.getElementById(`input-${id}`).value;

  const result =
    document.getElementById(`result-${id}`);

  const normalizedInput =
    normalizeText(input);

  const normalizedAnswer =
    normalizeText(section.answer);

  result.style.display = "block";

  if (normalizedInput === normalizedAnswer) {

    result.className = "result correct";

    result.innerHTML =
      "🎉 正解！";

  } else {

    result.className = "result incorrect";

    result.innerHTML = `
      <strong>惜しいです。</strong><br><br>
      あなたの回答：<br>
      ${escapeHtml(input)}<br><br>
      正解：<br>
      ${escapeHtml(section.answer)}
    `;
  }
}


// ============================
// Storage
// ============================

function saveSections() {

  if (!currentVideoId) return;

  localStorage.setItem(
    `englishTrainer_${currentVideoId}`,
    JSON.stringify(sections)
  );
}


function loadSections() {

  if (!currentVideoId) return;

  const saved =
    localStorage.getItem(
      `englishTrainer_${currentVideoId}`
    );

  if (saved) {

    try {
      sections = JSON.parse(saved);
    } catch(e) {
      sections = [];
    }

  } else {

    sections = [];

  }

  renderSections();
}


// ============================
// Timer
// ============================

setInterval(() => {

  if (!player || !player.getCurrentTime) return;

  const current =
    player.getCurrentTime();

  duration =
    player.getDuration() || 0;

  document.getElementById("currentTime").textContent =
    formatTime(current);

  document.getElementById("duration").textContent =
    formatTime(duration);

  document.getElementById("seekBar").max =
    duration;

  document.getElementById("seekBar").value =
    current;


  // A/B repeat

  if (
    repeatEnabled &&
    aPoint !== null &&
    bPoint !== null &&
    current >= bPoint
  ) {

    player.seekTo(aPoint, true);
  }


  // Section repeat

  sections.forEach(section => {

    if (
      section.repeat &&
      current >= section.end &&
      current < section.end + 2
    ) {

      player.seekTo(section.start, true);

    }

  });

}, 200);


// ============================
// Utilities
// ============================

function formatTime(seconds) {

  if (!seconds || isNaN(seconds)) {
    return "0:00";
  }

  const min =
    Math.floor(seconds / 60);

  const sec =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2, "0");

  return `${min}:${sec}`;
}


function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
